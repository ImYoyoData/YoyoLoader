name: build-and-release

# Two jobs:
#   build   - compile both platforms, upload the packaged archives as artifacts
#   release - only on a version tag or a manual run with a version, creates the
#             GitHub Release and attaches both archives plus their checksums
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: scripts\build_windows.bat

      - name: Package
        shell: cmd
        run: scripts\package_windows.bat ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoyoloader-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build
        env:
          CXX: clang++
          CC: clang
        run: scripts/build_linux.sh

      - name: Package
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoyoloader-linux
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    # Tag pushes and manual runs with a version publish a release; everything
    # else is build-only.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        id: collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.zip.sha256' -o -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -exec cp {} release/ \;
          ls -l release
          echo "count=$(ls release | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: YoyoLoader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            ## YoyoLoader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version }}

            Extract the archive for your platform directly into your BDS server root,
            then run `yoyo.exe` (Windows) or `./yoyo` (Linux) instead of the server binary.

            | Platform | Archive |
            |---|---|
            | Windows x64 | `YoyoLoader-*-win64.zip` |
            | Linux x64 | `YoyoLoader-*-linux64.tar.gz` |

            ### Supported BDS builds

            | Version | Status |
            |---|---|
            | 1.26.52.3 | full support |
            | 1.26.70.21 | partial — see `yoyo.log` at startup |

            Unknown builds are probed automatically. Features that cannot be verified on the
            running build are listed in `yoyo.log` and refused with a clear error instead of
            crashing the server.

            ### Included examples

            `plugins/home` (`/home`), `plugins/title` (`/title`), `plugins/tpa` (`/tpa`).

            Each archive has a matching `.sha256` file.
          files: release/*
